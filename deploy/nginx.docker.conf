# HR 人力池系统 · Docker 内部 Nginx
# 一个入口同时提供：H5 /、管理后台 /admin/、后端 API /api/；上传文件经 /api 鉴权读取

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 后端单文件上限 100MB（设备端压缩前的原片兜底），Nginx 留出余量
    client_max_body_size 110m;
    client_body_timeout 120s;

    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 容器重建后 backend 的 IP 可能变化，用 Docker DNS 动态解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 允许宿主机/上层 Nginx 通过 X-Forwarded-For 还原真实客户端 IP。
    # 只信任回环与私网来源；Docker Web 直接暴露时，公网客户端伪造的 XFF 不会生效。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /admin {
        return 301 /admin/;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带的 XFF：后端信任 Docker 内部代理，只采信 Nginx 写入的真实来源
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- OpenAPI 文档（生产公网关闭） ----------
    location ~ ^/(docs|redoc|openapi\.json)$ {
        access_log off;
        return 404;
    }

    # ---------- 本地上传目录不再公开 ----------
    # 照片/视频与简历同属个人数据，统一经 /api 鉴权读取：
    # 简历走 /api/applicant/{id}/resume（JWT），媒体走 /api/media/{token}（短时效签名）。
    # 直接访问 /uploads/ 一律 404，防止“URL 猜得到就看得见”。
    location /uploads/ {
        access_log off;
        return 404;
    }

    # ---------- 入口 HTML 禁止缓存 ----------
    # 镜像重建后 JS/CSS 文件名带新 hash，旧 index.html 会引用已不存在的资源导致白屏，
    # 因此入口 HTML 必须每次回源校验（expires -1 = no-cache）。深层路由 try_files
    # 最终会内部重定向到这里，同样生效。
    location = /index.html {
        expires -1;
    }

    location = /admin/index.html {
        expires -1;
    }

    # ---------- 管理后台（Vite base = /admin/） ----------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 学习笔记（禁止公网访问，防止落入 H5 SPA 兜底路由） ----------
    location ^~ /learning {
        access_log off;
        return 404;
    }

    # ---------- 静态资源长缓存 ----------
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /admin/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---------- H5 自助申请端（history 路由） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
