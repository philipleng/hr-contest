name: hr-contest

services:
  backend:
    image: ${IMAGE_BACKEND:?IMAGE_BACKEND is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/app/uploads
      - private_uploads:/app/app/private_uploads
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${IMAGE_WEB:?IMAGE_WEB is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
  private_uploads:
